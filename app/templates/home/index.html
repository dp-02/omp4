{% extends 'global/base.html' %}

{% block title %}
登入
{% endblock %}

{% block content %}
<div class="grid min-h-screen place-items-center bg-base-100"
     x-data
     @login-error.document="
        Swal.fire({
            icon: $event.detail.type,
            title: '登入失敗',
            text: $event.detail.message,
            confirmButtonColor: '#3b82f6'
        });
     ">

  <div class="card w-96 bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      
      <form hx-post="/choose_user/" 
            hx-target="body" 
            hx-swap="outerHTML"
            hx-on::before-swap="if(event.detail.xhr.response.length === 0) event.detail.shouldSwap = false;">
            
        <h2 class="card-title text-2xl font-bold mb-4">系統登入</h2>
        
        <div class="form-control" x-data="{ showPass: false }">
          <label class="label">
            <span class="label-text">請輸入密碼</span>
          </label>
          <div class="relative">
            <input :type="showPass ? 'text' : 'password'" 
                   name="password" 
                   placeholder="Password" 
                   class="input input-bordered w-full pr-10" 
                   required 
                   autofocus />
            
            <button type="button" 
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700"
                    @click="showPass = !showPass">
               <span x-text="showPass ? '隱藏' : '顯示'" class="text-xs"></span>
            </button>
          </div>
        </div>

        <div class="card-actions flex flex-col gap-4 mt-6">
          <button type="submit" class="btn btn-primary btn-block">
            登入 <span class="loading loading-spinner loading-sm htmx-indicator"></span>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
