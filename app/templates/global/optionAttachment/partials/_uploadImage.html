<div class="card bg-base-100 border shadow-sm relative group transition-all"
     :class="record.isSaved ? 'border-success/30 bg-success/5' : 'border-info/30'"
     x-data="{ 
        currentRecord: null,  init() {
            this.currentRecord = record; 
        },
        get displayPreviews() {
            if (!this.currentRecord) return [];
            return this.currentRecord.previews || [];
        },
        syncInputFiles() {
            const inputEl = this.$refs.fileInput;
            const dataTransfer = new DataTransfer();
            this.currentRecord.previews.forEach(preview => {
                if (!preview.isSaved && preview.fileObj) {
                    dataTransfer.items.add(preview.fileObj);
                }
            });
            inputEl.files = dataTransfer.files;
        },
        handleFileChange(event) {
            const newFiles = Array.from(event.target.files);
            if (newFiles.length > 0) {
                newFiles.forEach(file => {
                    if (this.currentRecord) {
                        this.currentRecord.previews.push({
                            url: URL.createObjectURL(file),
                            name: file.name,
                            isDoc: !file.type.startsWith('image/'),
                            isSaved: false,
                            fileObj: file // 重要：必須保存原始 File 物件
                        });
                    }
                });
                this.syncInputFiles();
            }
        },
        async removeImage(imgIndex, imgItem) {
                    if (!this.currentRecord) return;
                    if (imgItem.isSaved) {
                        if(!confirm('確定要刪除這張已存檔的照片嗎？')) return;
                        const resp = await fetch(`/api/optionAttachment/image/delete/${imgItem.uid}`, { method: 'DELETE' });
                        if(resp.ok) {
                            this.currentRecord.previews.splice(imgIndex, 1);
                            notyf.success('照片已刪除');
                        }
                    } 
                    else {
                        this.currentRecord.previews.splice(imgIndex, 1);
                        const inputEl = this.$refs.fileInput; 
                        const dataTransfer = new DataTransfer();
                        this.currentRecord.previews.forEach(preview => {
                            if (!preview.isSaved && preview.fileObj) {dataTransfer.items.add(preview.fileObj);}
                        });
                        inputEl.files = dataTransfer.files;
                        this.syncInputFiles();
                    }
                }
     }">
     <button type="button" 
            @click="removeRecord(record)"
            class="btn btn-circle btn-ghost btn-xs absolute top-2 right-2 z-10"
            :class="record.isSaved ? 'text-error hover:bg-error/10' : 'text-base-content/40 hover:text-error'">
        <i class="bi bi-trash"></i>
    </button>

    <div class="card-body p-4 gap-4">
        
        <div class="flex items-center gap-2 text-sm font-bold border-b border-base-200 pb-2"
             :class="record.isSaved ? 'text-success' : 'text-info'">
            <i class="bi" :class="record.isSaved ? 'bi-check-circle-fill' : 'bi-camera-fill'"></i>
            <span x-text="record.isSaved ? '已存檔紀錄' : '新照片紀錄'"></span>
            <span class="text-xs font-normal opacity-60 ml-auto" x-show="record.isSaved">
                ID: <span x-text="record.id"></span>
            </span>
        </div>

        <div class="form-control">
            <template x-if="record.isSaved">
                <input type="hidden" :name="'record_id_' + '{{ uid }}'" :value="record.id">
            </template>

            <textarea class="textarea textarea-bordered textarea-sm w-full transition-all" 
                      :class="record.isSaved ? 'focus:textarea-success' : 'focus:textarea-info'"
                      placeholder="請輸入說明..."
                      rows="2"
                      x-model="record.desc"
                      :name="record.isSaved ? 'update_desc_' + record.id : 'desc_' + '{{ uid }}_' + record.id"></textarea>
        </div>

        <div class="form-control">
            <input type="file" 
            x-ref="fileInput"
            class="file-input file-input-bordered file-input-sm w-full" 
            :class="record.isSaved ? 'file-input-success' : 'file-input-info'"
            accept="image/*"
            multiple
            @change="handleFileChange($event)"
            :name="record.isSaved ? 'append_files_' + record.id + '[]' : 'files_' + '{{ uid }}_' + record.id + '[]'" />
        </div>

        <div class="grid grid-cols-3 md:grid-cols-5 gap-2 mt-2" 
             x-show="record.previews && record.previews.length > 0">
            
            <template x-for="(img, idx) in record.previews" :key="idx">
                <div class="relative aspect-square rounded-lg overflow-hidden border bg-base-200 group/img"
                     :class="img.isSaved ? 'border-success/50' : 'border-info/50'">
                    
                    <template x-if="!img.isDoc">
                        <img :src="img.url" class="object-cover w-full h-full transition-transform group-hover/img:scale-110" />
                    </template>
                    
                    <template x-if="img.isDoc">
                        <div class="flex flex-col items-center justify-center w-full h-full text-base-content/50">
                            <i class="bi bi-file-earmark-text text-2xl"></i>
                            <span class="text-[10px] truncate w-full px-1 text-center" x-text="img.name"></span>
                        </div>
                    </template>

                    <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] text-center py-0.5 backdrop-blur-sm">
                        <span x-text="img.isSaved ? '已存' : '儲存'"></span>
                    </div>

                    <button type="button" 
                            @click="removeImage(idx, img, record)"
                            class="absolute top-1 right-1 btn btn-circle btn-error btn-xs opacity-0 group-hover/img:opacity-100 transition-opacity scale-90">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            </template>
        </div>
    </div>
</div>
