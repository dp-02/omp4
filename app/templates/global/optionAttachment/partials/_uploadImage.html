<div class="card bg-base-100 border shadow-sm relative group transition-all"
     :class="record.isSaved ? 'border-success/30 bg-success/5' : 'border-info/30'"
     x-data="{ 
        currentRecord: null,  init() {
            this.currentRecord = record; 
        },
        get displayPreviews() {
            if (!this.currentRecord) return [];
            return this.currentRecord.images_previews || [];
        },
        syncInputFiles() {
            const inputEl = this.$refs.fileInput;
            const dataTransfer = new DataTransfer();
            this.currentRecord.images_previews.forEach(preview => {
                if (!preview.isSaved && preview.fileObj) {
                    dataTransfer.items.add(preview.fileObj);
                }
            });
            inputEl.files = dataTransfer.files;
        },
        handleFileChange(event) {
            const newFiles = Array.from(event.target.files);
            if (newFiles.length > 0) {
                newFiles.forEach(file => {
                    if (this.currentRecord) {
                        this.currentRecord.images_previews.push({
                            url: URL.createObjectURL(file),
                            name: file.name,
                            isDoc: !file.type.startsWith('image/'),
                            isSaved: false,
                            fileObj: file // 重要：必須保存原始 File 物件
                        });
                    }
                });
                this.syncInputFiles();
            }
        },
        async removeImage(imgIndex, imgItem) {
                    if (!this.currentRecord) return;
                    if (imgItem.isSaved) {
                        if(!confirm('確定要刪除這張已存檔的照片嗎？')) return;
                        const resp = await fetch(`/api/optionAttachment/image/delete/${imgItem.uid}`, { method: 'DELETE' });
                        if(resp.ok) {
                            this.currentRecord.images_previews.splice(imgIndex, 1);
                            notyf.success('照片已刪除');
                        }
                    } 
                    else {
                        this.currentRecord.images_previews.splice(imgIndex, 1);
                        const inputEl = this.$refs.fileInput; 
                        const dataTransfer = new DataTransfer();
                        this.currentRecord.images_previews.forEach(preview => {
                            if (!preview.isSaved && preview.fileObj) {dataTransfer.items.add(preview.fileObj);}
                        });
                        inputEl.files = dataTransfer.files;
                        this.syncInputFiles();
                    }
                }
     }">
     <button type="button" 
            @click="removeRecord(record)"
            class="btn btn-circle btn-ghost btn-xs absolute top-2 right-2 z-10"
            :class="record.isSaved ? 'text-error hover:bg-error/10' : 'text-base-content/40 hover:text-error'">
        <i class="bi bi-trash"></i>
    </button>

    <div class="card-body p-4 gap-4">
        
        <div class="flex items-center gap-2 text-sm font-bold border-b border-base-200 pb-2"
             :class="record.isSaved ? 'text-success' : 'text-info'">
            <i class="bi" :class="record.isSaved ? 'bi-check-circle-fill' : 'bi-camera-fill'"></i>
            <span x-text="record.isSaved ? '已存檔紀錄' : '新照片紀錄'"></span>
        </div>

        {% include 'global/optionAttachment/partials/_imageNote.html' %}

        {% include 'global/optionAttachment/partials/_imageImage.html' %}
    </div>
</div>
