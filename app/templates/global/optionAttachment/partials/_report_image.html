<div class="w-full bg-base-100 rounded-xl border border-base-300 overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300">
    
    <div class="bg-base-200/60 px-5 py-3 border-b border-base-300 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="badge badge-neutral gap-2 font-medium">
                <i class="bi bi-images"></i>
                照片紀錄
            </div>
            <span class="text-sm font-mono opacity-50">#{{ uid }}</span>
        </div>
        <span class="text-xs text-base-content/50 font-medium">
            共 {{ images|length }} 張照片
        </span>
    </div>

    <div class="p-5 space-y-4">
        
        {% if note %}
        <div class="alert bg-base-100 border border-base-200 text-sm shadow-sm flex-col items-start gap-1 p-3">
            <span class="text-xs font-bold opacity-50 uppercase flex items-center gap-2">
                <i class="bi bi-journal-text"></i> 備註 Note
            </span>
            <div class="opacity-80 whitespace-pre-wrap pl-1">{{ note }}</div>
        </div>
        {% endif %}

        {% if images %}
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            {% for img in images %}
            <div class="group flex flex-col bg-base-100 rounded-lg overflow-hidden border border-base-300 shadow-sm break-inside-avoid">
                
                <div class="relative aspect-square bg-base-200 overflow-hidden">
                    <a href="{{ img.url }}" target="_blank" class="block w-full h-full cursor-zoom-in" title="{{ img.name }}">
                        <img src="{{ img.url }}" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
                             loading="lazy"
                             alt="{{ img.name }}">
                    </a>
                    
                    <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200 print:hidden">
                        <a href="{{ img.url }}" download class="btn btn-circle btn-xs btn-neutral text-white shadow-md tooltip tooltip-left" data-tip="下載圖片">
                            <i class="bi bi-download"></i>
                        </a>
                    </div>
                </div>

                <div class="px-3 py-2 bg-base-50 border-t border-base-200 flex flex-col gap-1">
                    <div class="flex items-center gap-2 text-base-content/80 overflow-hidden">
                        <i class="bi bi-person-fill text-xs opacity-60 shrink-0"></i>
                        <span class="text-xs font-bold truncate" title="{{ img.userName }}">
                            {{ img.userName }}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 text-base-content/50">
                        <i class="bi bi-clock text-[10px] shrink-0"></i>
                        <span class="text-[10px] font-mono truncate">
                            {{ img.atCreatedtime }}
                        </span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="flex flex-col items-center justify-center py-8 text-base-content/30 gap-2 border-2 border-dashed border-base-200 rounded-lg">
            <i class="bi bi-image text-3xl"></i>
            <span class="text-sm">此項目未上傳任何照片</span>
        </div>
        {% endif %}

    </div>
</div>
