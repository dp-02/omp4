<div x-data="{
        targetUid: {{ uid }}, 
        targetTableType: '{{ table_type }}',
        siteUid: '{{ data.site_uid }}',
        checklistUid: `{{ data.checklist_uid if data is defined and data.checklist_uid else '' }}`,
        records: [],
        isLoading: false,
        isAddMenuOpen: false, 

        async init() {
            await this.loadData();
        },

        async loadData() {
            this.isLoading = true;
            try {
                let url = `/api/optionAttachment/get_saved/${this.targetTableType}/${this.targetUid}`;
                
                if (this.checklistUid) {
                    url += `?checklist_uid=${this.checklistUid}`;
                }
                if (this.siteUid) {
                    url += `?site_uid=${this.siteUid}`;
                }


                const response = await fetch(url);
                
                if (response.ok) {
                    const savedData = await response.json();
                    
                    this.records = savedData.map(item => ({
                        id: item.id,            
                        type: item.type,        
                        note: item.note || '',
                        state: item.state || '0', 
                        isSaved: true,
                        inv: item.inv || '',
                        mppt: item.mppt || '',
                        string: item.string || '',
                        panel: item.panel || '',
                        reason: item.reason || '',
                        optimizer: item.optimizer || '',
                        breaker: Array.isArray(item.breaker) ? item.breaker : [],
                        damaged_images: item.damaged_images || {},
                        images_previews: (item.images || []).map(img => ({
                            uid: img.uid,       
                            url: img.url,       
                            name: img.name,   
                            userName: img.userName,   
                            atCreatedtime: img.atCreatedtime,
                            isDoc: false,       
                            isSaved: true
                        })),
                        anomaly_previews: (item.anomaly_images || []).map(img => ({
                            uid: img.uid,       
                            url: img.url,       
                            name: img.name,
                            isDoc: false,       
                            isSaved: true,
                            category: img.category || 'before' 
                        }))
                    }));
                }
            } catch (error) {
                console.error('載入失敗:', error);
                if (typeof notyf !== 'undefined') notyf.error('載入資料失敗');
            } finally {
                this.isLoading = false;
            }
        },
        
        addRecord(type) {
            let newRecord = {
                id: Date.now(), // 臨時 ID
                type: type,
                note: '',
                images_previews: [],
                isSaved: false,
                state: '0'
            };

            if (type === 'anomaly') {
                newRecord = {
                    ...newRecord,
                    inv: '',
                    mppt: '',
                    string: '',
                    panel: '',
                    reason: '',
                    optimizer: '',
                    breaker: [],      // 初始化為空陣列，供 checkbox 使用
                    damaged_images: {} // 初始化為空物件，供六面圖使用
                };
            }

            this.records.push(newRecord);
            this.isAddMenuOpen = false;
            
            this.$nextTick(() => {
                const lastRecord = this.$el.lastElementChild;
                if(lastRecord) lastRecord.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        },
        
        async removeRecord(record) {
            if (!confirm('確定要刪除此筆紀錄嗎？')) return;
            
            if (record.isSaved) {
                try {
                    const resp = await fetch(`/api/optionAttachment/delete/${record.id}`, { method: 'DELETE' });
                    
                    if (resp.ok) {
                        this.records = this.records.filter(r => r.id !== record.id);
                        if (typeof notyf !== 'undefined') notyf.success('紀錄已刪除');
                    } else {
                        if (typeof notyf !== 'undefined') notyf.error('刪除失敗');
                    }
                } catch (e) {
                    console.error(e);
                    if (typeof notyf !== 'undefined') notyf.error('刪除發生錯誤');
                }
            } else {
                this.records = this.records.filter(r => r.id !== record.id);
            }
        }
     }"
     @reload-attachments.window="loadData()"
     class="mt-4 w-full flex flex-col gap-4">

    <div class="flex flex-col gap-4 mb-4">
        <template x-for="(record, index) in records" :key="record.id">
            <div>
                <template x-if="record.type === 'image'">
                    {% include 'global/optionAttachment/partials/_uploadImage.html' %}
                </template>

                <template x-if="record.type === 'anomaly'">
                    {% include 'global/optionAttachment/partials/_anomaly.html' %}
                </template>
            </div>
        </template>
    </div>

    <div class="collapse collapse-arrow bg-base-200 border border-base-300 rounded-box">
        
        <input type="checkbox" x-model="isAddMenuOpen" /> 
        
        <div class="collapse-title text-base font-bold flex items-center gap-2">
            <i class="bi bi-plus-circle-fill text-primary"></i>
            新增紀錄
        </div>
        
        <div class="collapse-content">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 pb-2">
                <button type="button"
                        @click="addRecord('image')"
                        class="btn btn-outline btn-info border-dashed border-2 hover:bg-info hover:text-white gap-2 h-auto py-2">
                    <i class="bi bi-camera-fill text-xl"></i>
                    <div class="flex flex-col items-start">
                        <span class="font-bold">新增照片說明</span>
                        <span class="text-[10px] opacity-70 font-normal">一張說明 + 多張照片</span>
                    </div>
                </button>

                <button type="button"
                        @click="addRecord('anomaly')"
                        class="btn btn-outline btn-warning border-dashed border-2 hover:bg-warning hover:text-white gap-2 h-auto py-2">
                    <i class="bi bi-exclamation-triangle-fill text-xl"></i>
                    <div class="flex flex-col items-start">
                        <span class="font-bold">新增異常紀錄</span>
                        <span class="text-[10px] opacity-70 font-normal">紀錄異常狀況與對策</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

</div>
