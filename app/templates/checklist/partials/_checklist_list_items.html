{% if data_c %}
<div class="overflow-x-auto w-full">
    <table class="table table-zebra bg-base-100 rounded-lg shadow-sm">
        <thead>
            <tr>
                <th>檢測日期</th>
                <th class="hidden md:table-cell">檢測人員</th>
                <th class="text-center">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for data_c_c in data_c %}
            <tr class="hover">
                <td>
                    <div class="font-bold">{{ data_c_c.check_date }}</div>
                </td>
                <td class="hidden md:table-cell">{{ data_c_c.user_name }}</td>
                <td class="text-center">
                    <a href="/checklist/{{ data.site_uid }}/{{ data.check_type }}/{{ data_c_c.uid }}/" class="btn btn-sm btn-ghost text-success">
                        <i class="bi bi-gear"></i> 管理
                    </a>
                    <a href="/checklist/{{ data_c_c.uid }}/update/" class="btn btn-sm btn-ghost text-primary">
                        <i class="bi bi-pencil-square"></i> 編輯
                    </a>
                    <button class="btn btn-sm btn-ghost text-error"
                    hx-delete="/api/checklist/delete/{{ data_c_c.uid }}"
                    hx-target="closest tr"
                    hx-swap="outerHTML swap:1s"
                    hx-on:htmx:confirm="
                        const e = event;
                        e.preventDefault();
                        Swal.fire({
                            title: '確定要刪除嗎？',
                            text: '刪除後將無法復原 {{ data_c_c.check_date }} 的資料！',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#d33',
                            cancelButtonColor: '#3085d6',
                            confirmButtonText: '是的，刪除它！',
                            cancelButtonText: '取消'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                e.detail.issueRequest(true); 
                            }
                        });
                    ">
                        <i class="bi bi-trash"></i> 刪除
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% else %}
<div class="flex flex-col items-center justify-center py-10 text-base-content/50">
    <i class="bi bi-inbox text-4xl mb-2"></i>
    <p>目前此區域尚無檢查表資料</p>
    <p class="text-sm">點擊右上角「新增檢查表」建立第一筆資料</p>
</div>
{% endif %}
