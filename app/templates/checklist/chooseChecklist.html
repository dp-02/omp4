{% extends 'global/base.html' %}

{% block title %}
電廠{% if data.check_type == 1%}檢測{% else %}維修{% endif %}
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="card bg-base-100 shadow-xl border border-base-200">
        <div class="card-body">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h1 id="region" 
                    data-region-index="{{region_index}}" 
                    class="card-title text-3xl font-bold">
                    電廠{% if data.check_type == 1%}檢測{% else %}維修{% endif %}
                </h1>
                
                <a class="btn btn-primary" href="/checklist/{{data.site_uid}}/{{data.check_type}}/create/" role="button">
                    <i class="bi bi-plus-lg"></i>
                    新增檢查表
                </a>
            </div>

            <div id="checkList" 
                 class="bg-base-200 rounded-box p-4 mb-6 min-h-[100px] flex justify-center items-center"
                 hx-get="/api/checklist/get/site/{{data.site_uid}}/{{data.check_type}}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                 
                <span class="loading loading-dots loading-lg  text-primary htmx-indicator"></span>
            </div>

            <div class="card-actions">
                <a class="btn btn-neutral btn-outline gap-2" href="/site/{{data.site_uid}}/" role="button">
                    <i class="bi bi-arrow-return-left"></i>
                    返回
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
