{% if options %}
    {% for opt in options %}
    <div class="flex items-center gap-2 p-1 border border-base-200 rounded hover:bg-base-200/50">
        {% if opt.has_record %}
            <span class="badge badge-success badge-sm gap-1">
                <i class="bi bi-check"></i>
            </span>
        {% else %}
            <span class="badge badge-ghost badge-sm text-gray-400">
                <i class="bi bi-slash"></i>
            </span>
        {% endif %}
        <span class="text-sm {{ 'text-base-content' if opt.checked else 'text-gray-400' }}">
            {{ loop.index }}. {{ opt.name }}
        </span>
    </div>
    {% endfor %}
{% else %}
    <div class="col-span-full text-center text-gray-400 py-2">此版本無檢查紀錄</div>
{% endif %}


<p id="historyNote" class="text-base-content/80 min-h-[2rem] mb-4" hx-swap-oob="true">
    {{ designlist_data.note }}
</p>

<a id="download1" 
   class="btn btn-primary btn-outline w-full shadow-sm {{ '' if designlist_data.file_path_cad_1 else 'btn-disabled' }}" 
   {% if designlist_data.file_path_cad_1 %}
       href="/download/attachment/{{ designlist_data.file_path_cad_1 }}"
       {% if not designlist_data.is_latest %}
           onclick="event.preventDefault(); 
                    Swal.fire({
                        title: '非最新版本警告',
                        text: '您目前正在檢視歷史紀錄，確定要下載舊版 CAD 檔案嗎？',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: '確定下載',
                        cancelButtonText: '取消',
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#3085d6',
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = this.href;
                        }
                    });"
       {% endif %}
   {% else %}
       role="button" aria-disabled="true" tabindex="-1"
   {% endif %}
   hx-swap-oob="true">
    <i class="bi bi-download"></i> 下載 CAD / SKETCHUP（一）
</a>
