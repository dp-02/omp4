{% extends 'global/base.html' %}

{% block title %}
設計規範
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="card bg-base-100 shadow-xl border border-base-200 max-w-3xl mx-auto">
        <div class="card-body">
            
            <h1 class="card-title text-3xl font-bold mb-6 pb-2 border-b border-base-200">
                {% if data.graph_type == 'design'%}<i class="bi bi-vector-pen mr-2 text-secondary"></i>
                {%else%}<i class="bi bi-map mr-2 text-primary"></i>{%endif%}
                選擇期數
            </h1>

            <div class="flex flex-col gap-4 mb-8">
                {% for data_p in data.phase %}
                    <a class="btn {% if data.graph_type == 'design'%}btn-secondary{%else%}btn-primary{%endif%} btn-lg w-full text-white text-xl shadow-md hover:scale-[1.01] transition-transform duration-200 justify-between group" 
                       href="/design/{{data.graph_type}}/{{data.site_uid}}/{{ data.group_uid }}/{{ data_p.uid }}/" 
                       role="button">
                        <span>第 {{data_p.sort}} 期</span>
                        <i class="bi bi-chevron-right opacity-70 group-hover:translate-x-1 transition-transform"></i>
                    </a>
                {% else %}
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        <span>沒有期數資料。</span>
                    </div>
                {% endfor %}
            </div>

            <div class="card-actions">
                <a class="btn btn-neutral btn-outline gap-2" href="/design/{{data.graph_type}}/{{data.site_uid}}/" role="button">
                    <i class="bi bi-arrow-return-left"></i> 
                    返回設計規範
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
