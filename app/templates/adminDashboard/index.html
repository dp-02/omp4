{% extends 'global/base.html' %}

{% block title %}
管理後臺 - 使用者列表
{% endblock %}

{% block content %}
<div x-data="{ 
    notyf: new Notyf({position: {x: 'right', y: 'top'}}),
    confirmDelete(event) {
        // 使用 SweetAlert 接管 HTMX 的確認流程
        event.preventDefault();
        Swal.fire({
            title: '確定要刪除這位使用者嗎？',
            text: '此動作無法復原！',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: '是的，刪除！',
            cancelButtonText: '取消'
        }).then((result) => {
            if (result.isConfirmed) {
                // 確認後，手動觸發 HTMX 请求
                htmx.trigger(event.target, 'confirmed-delete');
            }
        });
    }
}" 
class="min-h-screen p-4 lg:p-10">
  <div class="card w-full max-w-6xl mx-auto bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      
      <div class="flex justify-between items-center mb-6">
        <h2 class="card-title text-2xl font-bold">使用者管理儀錶板</h2>
        
        <a href="/adminDashboard/create/" class="btn btn-primary gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          新增使用者
        </a>
      </div>

      <div class="overflow-x-auto">
        <table class="table table-zebra w-full">
          <thead>
            <tr>
              <th>LINE_ID</th>
              <th>使用者名稱</th>
              <th class="text-center">操作</th>
            </tr>
          </thead>
          
          <tbody id="users-table-body"
                 hx-get="/api/adminDashboard/partials/get_user_rows" 
                 hx-trigger="load" 
                 hx-swap="innerHTML">
            
            <tr>
              <td colspan="5" class="text-center py-10">
                <span class="loading loading-spinner loading-lg text-primary"></span>
                <p class="mt-2 text-gray-500">正在載入使用者資料...</p>
              </td>
            </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>

{% endblock %}
{% block scripts %}
<script>
  // 初始化 Notyf
  const notyf = new Notyf({
      position: {x: 'right', y: 'top'},
      duration: 3000,
      dismissible: true
  });

  // 監聽來自後端的 HTMX 事件
  document.body.addEventListener('showToast', function(evt) {
      // evt.detail 會包含後端傳來的 json 資料
      const data = evt.detail;
      
      if (data.type === 'success') {
          notyf.success(data.message);
      } else {
          notyf.error(data.message);
      }
  });

  // 處理 HTMX 請求錯誤 (例如 404 或 500 時，預設 HTMX 不會 swap)
  document.body.addEventListener('htmx:responseError', function(evt) {
      // 如果後端有傳回錯誤訊息 JSON
      let errorMsg = "發生未知錯誤";
      try {
          const response = JSON.parse(evt.detail.xhr.responseText);
          errorMsg = response.error || errorMsg;
      } catch(e) {}
      
      notyf.error(errorMsg);
  });
</script>
{% endblock %}
